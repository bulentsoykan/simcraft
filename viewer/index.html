<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SimCraft Viewer</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #1a1a2e;
        color: #eee;
        overflow: hidden;
      }

      #app {
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      #canvas-container {
        flex: 1;
        position: relative;
      }

      canvas {
        display: block;
      }

      #controls {
        height: 80px;
        background: #16213e;
        border-top: 1px solid #0f3460;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding: 0 20px;
      }

      #timeline {
        flex: 1;
        max-width: 600px;
        height: 8px;
        -webkit-appearance: none;
        appearance: none;
        background: #0f3460;
        border-radius: 4px;
        cursor: pointer;
      }

      #timeline::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 16px;
        height: 16px;
        background: #e94560;
        border-radius: 50%;
        cursor: pointer;
      }

      .btn {
        background: #0f3460;
        border: none;
        color: #eee;
        padding: 10px 20px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
        transition: background 0.2s;
      }

      .btn:hover {
        background: #e94560;
      }

      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      #time-display {
        font-family: monospace;
        font-size: 14px;
        min-width: 120px;
        text-align: center;
      }

      #speed-control {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      #speed {
        width: 60px;
        background: #0f3460;
        border: none;
        color: #eee;
        padding: 6px;
        border-radius: 4px;
        text-align: center;
      }

      #file-input {
        display: none;
      }

      #load-label {
        background: #0f3460;
        padding: 10px 20px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
        transition: background 0.2s;
      }

      #load-label:hover {
        background: #e94560;
      }

      #info {
        position: absolute;
        top: 10px;
        left: 10px;
        background: rgba(22, 33, 62, 0.9);
        padding: 10px 15px;
        border-radius: 6px;
        font-size: 12px;
      }

      #info h3 {
        margin-bottom: 5px;
        color: #e94560;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="canvas-container">
        <div id="info">
          <h3>SimCraft Viewer</h3>
          <div id="sim-info">Load an animation.json file to begin</div>
        </div>
      </div>
      <div id="controls">
        <input type="file" id="file-input" accept=".json" />
        <label for="file-input" id="load-label">Load JSON</label>
        <button class="btn" id="play-btn" disabled>Play</button>
        <button class="btn" id="step-btn" disabled>Step</button>
        <input type="range" id="timeline" min="0" max="100" value="0" step="0.1" disabled />
        <div id="time-display">t = 0.00</div>
        <div id="speed-control">
          <label for="speed">Speed:</label>
          <select id="speed">
            <option value="0.25">0.25x</option>
            <option value="0.5">0.5x</option>
            <option value="1" selected>1x</option>
            <option value="2">2x</option>
            <option value="5">5x</option>
            <option value="10">10x</option>
          </select>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
